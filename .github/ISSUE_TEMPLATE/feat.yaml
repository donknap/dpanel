
name: "✨ 功能需求 / Feature Request"
description: "提出新功能或改进建议 / Suggest a new feature or improvement"
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你为 DPanel 提出功能建议！
        Thank you for helping improve DPanel!

        请尽量完整地填写以下信息，帮助我们理解需求的背景和目标。
        Please provide as much detail as possible so we can understand the motivation and goals of your request.

        提交前请先搜索是否已有相同或类似的 Issue。
        Before submitting, please check for existing or similar issues.

  - type: textarea
    id: motivation
    attributes:
      label: "需求背景与要解决的问题 / Motivation & Problem"
      description: |
        这个需求的出发点是什么？目前遇到了什么问题，或者哪些使用场景尚未得到满足？
        What motivates this request? What problem are you facing, or which use case is not currently supported?
      placeholder: |
        当前遇到的问题或使用场景：
        Current problem or use case:
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: "功能需求详细描述 / Detailed Feature Description"
      description: |
        请详细描述你希望 DPanel 增加或改进的功能，包括预期的操作方式和最终效果。
        Describe the feature or improvement you'd like to see, including how it should work and the expected result.
      placeholder: |
        希望实现的功能：
        预期的使用方式或效果：

        Desired feature:
        Expected behavior or result:
    validations:
      required: true

  - type: textarea
    id: implementation-suggestions
    attributes:
      label: "开发建议与参考资料 / Implementation Suggestions & References"
      description: |
        如果有实现思路、示例、相关库、开源项目或参考链接，请在这里提供。可以直接粘贴截图。
        If you have implementation ideas, examples, libraries, open-source projects, or relevant links, share them here. You can also paste screenshots.
      placeholder: |
        实现建议、参考项目或链接（可选）：
        Implementation ideas, related projects, or links (optional):
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### 交流与反馈 / Discussion & Feedback

        DPanel QQ 群 / QQ Group：**837583876**

        建议保留 GitHub Issue，以便跟踪需求的讨论和实现进度。
        Please keep the GitHub Issue open for discussion and progress tracking.

